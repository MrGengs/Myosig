<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Admin Panel</title>
    <link rel="icon" href="../assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <a href="index.html" class="app-bar-brand">
                <img src="../assets/image/logo.png" alt="Myosig" class="app-bar-logo">
            </a>
            <span class="app-bar-page-title" style="font-weight:600; color:var(--text-dark); font-size:0.95rem;">Admin Panel</span>
            <div class="app-bar-actions">
                <div class="admin-avatar-wrap">
                    <div class="admin-avatar-btn" id="adminAvatarBtn" onclick="toggleAdminDropdown()" title="Profil Admin">A</div>
                    <div class="admin-avatar-dropdown" id="adminAvatarDropdown">
                        <div class="admin-avatar-dropdown-header">
                            <div class="admin-avatar-dropdown-name" id="adminDropdownName">Admin</div>
                            <div class="admin-avatar-dropdown-email" id="adminDropdownEmail">admin@myosig.com</div>
                        </div>
                        <button class="admin-avatar-dropdown-item danger" onclick="closeAdminDropdown(); adminLogout();">
                            <i class="bi bi-box-arrow-right"></i> Keluar
                        </button>
                    </div>
                </div>
                <div class="admin-avatar-overlay" id="adminAvatarOverlay" onclick="closeAdminDropdown()"></div>
            </div>
        </div>
    </header>

    <div class="container" style="padding-bottom: 100px;">

        <!-- Page Header -->
        <div class="page-header fade-in">
            <div class="admin-logo-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1>Admin Panel</h1>
            <p id="adminGreeting">Selamat datang, Admin</p>
        </div>

        <!-- Stats Overview -->
        <div class="stats-grid fade-in">
            <div class="stat-card" onclick="window.location.href='users.html'" style="cursor:pointer;">
                <div class="stat-icon"><i class="bi bi-people"></i></div>
                <div class="stat-value" id="statTotalUsers">-</div>
                <div class="stat-label">Total Dokter</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="bi bi-person-heart"></i></div>
                <div class="stat-value" id="statTotalPatients">-</div>
                <div class="stat-label">Total Pasien</div>
            </div>
            <div class="stat-card" onclick="window.location.href='manage-data.html'" style="cursor:pointer;">
                <div class="stat-icon"><i class="bi bi-activity"></i></div>
                <div class="stat-value" id="statTotalRecords">-</div>
                <div class="stat-label">Total Record</div>
            </div>
            <div class="stat-card" onclick="window.location.href='banners.html'" style="cursor:pointer;">
                <div class="stat-icon"><i class="bi bi-images"></i></div>
                <div class="stat-value" id="statTotalBanners">-</div>
                <div class="stat-label">Banner Aktif</div>
            </div>
        </div>

        <!-- Menu -->
        <div class="card fade-in">
            <div class="card-header">
                <h2 class="card-title"><i class="bi bi-grid card-icon"></i> Menu Admin</h2>
            </div>
            <div class="admin-actions-grid">
                <a href="users.html" class="admin-action-btn">
                    <i class="bi bi-people"></i>
                    <span>Anggota</span>
                </a>
                <a href="manage-data.html" class="admin-action-btn">
                    <i class="bi bi-database-gear"></i>
                    <span>Kelola Data</span>
                </a>
                <a href="banners.html" class="admin-action-btn">
                    <i class="bi bi-images"></i>
                    <span>Banner</span>
                </a>
                <a href="../dashboard.html" class="admin-action-btn">
                    <i class="bi bi-box-arrow-up-right"></i>
                    <span>Lihat App</span>
                </a>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="bi bi-speedometer2" style="color: #2563eb !important; display: inline-block !important; visibility: visible !important; opacity: 1 !important; font-size: 1.5rem !important; z-index: 1000 !important; position: relative !important; -webkit-text-fill-color: #2563eb !important; background: transparent !important; font-family: 'bootstrap-icons' !important;"></i>
            <span>Dashboard</span>
        </a>
        <a href="users.html" class="nav-item">
            <i class="bi bi-people"></i>
            <span>Anggota</span>
        </a>
        <a href="banners.html" class="nav-item">
            <i class="bi bi-images"></i>
            <span>Banner</span>
        </a>
        <a href="manage-data.html" class="nav-item">
            <i class="bi bi-database-gear"></i>
            <span>Data</span>
        </a>
    </nav>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/admin/admin-shared.js"></script>
    <script src="../js/admin/admin-dashboard.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
