<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Kelola Anggota</title>
    <link rel="icon" href="../assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <a href="index.html" class="app-bar-brand">
                <img src="../assets/image/logo.png" alt="Myosig" class="app-bar-logo">
            </a>
            <span class="app-bar-page-title" style="font-weight:600; color:var(--text-dark); font-size:0.95rem;">Admin Panel</span>
            <div class="app-bar-actions">
                <div class="admin-avatar-wrap">
                    <div class="admin-avatar-btn" id="adminAvatarBtn" onclick="toggleAdminDropdown()" title="Profil Admin">A</div>
                    <div class="admin-avatar-dropdown" id="adminAvatarDropdown">
                        <div class="admin-avatar-dropdown-header">
                            <div class="admin-avatar-dropdown-name" id="adminDropdownName">Admin</div>
                            <div class="admin-avatar-dropdown-email" id="adminDropdownEmail">admin@myosig.com</div>
                        </div>
                        <button class="admin-avatar-dropdown-item danger" onclick="closeAdminDropdown(); adminLogout();">
                            <i class="bi bi-box-arrow-right"></i> Keluar
                        </button>
                    </div>
                </div>
                <div class="admin-avatar-overlay" id="adminAvatarOverlay" onclick="closeAdminDropdown()"></div>
            </div>
        </div>
    </header>

    <div class="container" style="padding-bottom: 100px;">

        <!-- Page Header -->
        <div class="page-header fade-in">
            <h1><i class="bi bi-people" style="color: var(--primary-blue);"></i> Daftar Anggota</h1>
            <p>Total: <strong id="totalUsersCount">-</strong> dokter terdaftar</p>
        </div>

        <!-- Users List -->
        <div id="usersList" class="admin-list fade-in">
            <div class="admin-list-loading">
                <i class="bi bi-hourglass-split"></i>
                <p>Memuat data dokter...</p>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>
        <a href="users.html" class="nav-item active">
            <i class="bi bi-people" style="color: #2563eb !important; display: inline-block !important; visibility: visible !important; opacity: 1 !important; font-size: 1.5rem !important; z-index: 1000 !important; position: relative !important; -webkit-text-fill-color: #2563eb !important; background: transparent !important; font-family: 'bootstrap-icons' !important;"></i>
            <span>Anggota</span>
        </a>
        <a href="banners.html" class="nav-item">
            <i class="bi bi-images"></i>
            <span>Banner</span>
        </a>
        <a href="manage-data.html" class="nav-item">
            <i class="bi bi-database-gear"></i>
            <span>Data</span>
        </a>
    </nav>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/admin/admin-shared.js"></script>
    <script src="../js/admin/admin-users.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
