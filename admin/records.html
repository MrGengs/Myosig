<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Medical Records</title>
    <link rel="icon" href="../assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <button onclick="window.history.back()" class="app-bar-back">
                <i class="bi bi-arrow-left"></i>
                <span>Back</span>
            </button>
            <span class="app-bar-page-title">Medical Records</span>
            <div class="app-bar-actions">
                <div class="admin-avatar-wrap">
                    <div class="admin-avatar-btn" id="adminAvatarBtn" onclick="toggleAdminDropdown()" title="Admin Profile">A</div>
                    <div class="admin-avatar-dropdown" id="adminAvatarDropdown">
                        <div class="admin-avatar-dropdown-header">
                            <div class="admin-avatar-dropdown-name" id="adminDropdownName">Admin</div>
                            <div class="admin-avatar-dropdown-email" id="adminDropdownEmail">admin@myosig.com</div>
                        </div>
                        <button class="admin-avatar-dropdown-item danger" onclick="closeAdminDropdown(); adminLogout();">
                            <i class="bi bi-box-arrow-right"></i> Sign Out
                        </button>
                    </div>
                </div>
                <div class="admin-avatar-overlay" id="adminAvatarOverlay" onclick="closeAdminDropdown()"></div>
            </div>
        </div>
    </header>

    <button class="lang-toggle-btn" onclick="toggleLang()" style="background: transparent; border: 2px solid #2563eb; color: #2563eb; padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.75rem; border-radius: 8px; cursor: pointer; position: fixed; top: 10px; right: 10px; z-index: 9999;">ID</button>

    <div class="container" style="padding-bottom: 100px;">

        <!-- Patient Info Header -->
        <div class="page-header fade-in">
            <div class="admin-user-avatar" style="width:70px; height:70px; font-size:2rem; margin:0 auto 0.75rem; background:linear-gradient(135deg, #0891b2, #06b6d4);">
                <span id="patientInitial">P</span>
            </div>
            <h1 id="patientName">Patient</h1>
            <p>Total: <strong id="totalRecordsCount">-</strong> monitoring records</p>
        </div>

        <!-- Patient Detail Card -->
        <div class="card fade-in">
            <div class="card-header">
                <h2 class="card-title"><i class="bi bi-person-vcard card-icon"></i> Patient Information</h2>
            </div>
            <div id="patientInfo" class="admin-patient-details" style="border-top:none; margin-top:0; padding-top:0;">
                <div class="admin-list-loading" style="padding:1rem;">
                    <i class="bi bi-hourglass-split"></i>
                    <p>Loading patient info...</p>
                </div>
            </div>
        </div>

        <!-- Record List -->
        <div class="card fade-in">
            <div class="card-header">
                <h2 class="card-title"><i class="bi bi-activity card-icon"></i> Record History</h2>
            </div>
            <div id="recordsList" class="admin-list">
                <div class="admin-list-loading">
                    <i class="bi bi-hourglass-split"></i>
                    <p>Loading records...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Photo Lightbox -->
    <div id="photoLightbox" class="admin-photo-lightbox" onclick="closePhotoLightbox(event)">
        <div class="admin-photo-lightbox-header">
            <span>Documentation Photo</span>
            <button onclick="closePhotoLightbox(event)"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="admin-photo-lightbox-body">
            <img id="photoLightboxImg" src="" alt="Documentation Photo">
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <script src="../js/translations.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/admin/admin-shared.js"></script>
    <script src="../js/admin/admin-records.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
