<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Manage Data</title>
    <link rel="icon" href="../assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <button class="lang-toggle-btn" onclick="toggleLang()" style="position: fixed; top: 10px; right: 10px; z-index: 9999; background: transparent; border: 2px solid #2563eb; color: #2563eb; padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.75rem; border-radius: 8px; cursor: pointer;">ID</button>
    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <a href="../dashboard.html" class="app-bar-brand">
                <img src="../assets/image/logo.png" alt="Myosig" class="app-bar-logo">
            </a>
            <span class="app-bar-page-title" style="font-weight:600; color:var(--text-dark); font-size:0.95rem;">Admin Panel</span>
            <div class="app-bar-actions">
                <div class="admin-avatar-wrap">
                    <div class="admin-avatar-btn" id="adminAvatarBtn" onclick="toggleAdminDropdown()" title="Admin Profile">A</div>
                    <div class="admin-avatar-dropdown" id="adminAvatarDropdown">
                        <div class="admin-avatar-dropdown-header">
                            <div class="admin-avatar-dropdown-name" id="adminDropdownName">Admin</div>
                            <div class="admin-avatar-dropdown-email" id="adminDropdownEmail">admin@myosig.com</div>
                        </div>
                        <button class="admin-avatar-dropdown-item danger" onclick="closeAdminDropdown(); adminLogout();">
                            <i class="bi bi-box-arrow-right"></i> Sign Out
                        </button>
                    </div>
                </div>
                <div class="admin-avatar-overlay" id="adminAvatarOverlay" onclick="closeAdminDropdown()"></div>
            </div>
        </div>
    </header>

    <div class="container" style="padding-bottom: 100px;">
        <!-- Page Header -->
        <div class="page-header fade-in">
            <h1>
                <i class="bi bi-pencil-square" style="color: var(--primary-blue);"></i>
                Manage Data
            </h1>
            <p>Manage patient data and monitoring records</p>
        </div>

        <!-- User Selection Card -->
        <div class="dummy-form-card fade-in">
            <div class="dummy-form-group">
                <label class="dummy-form-label">
                    <i class="bi bi-person-badge"></i>
                    Select User (Doctor)
                </label>
                <select id="userSelect" class="dummy-select" onchange="loadUserPatients()">
                    <option value="">Loading user list...</option>
                </select>
            </div>
        </div>

        <!-- Patient Selection Card -->
        <div class="dummy-form-card fade-in" id="managePatientCard" style="display: none;">
            <div class="dummy-form-group">
                <label class="dummy-form-label">
                    <i class="bi bi-person-heart"></i>
                    Select Patient
                </label>
                <select id="managePatientSelect" class="dummy-select" onchange="loadPatientRecords()">
                    <option value="">Select patient...</option>
                </select>
            </div>
        </div>

        <!-- Records List Card -->
        <div class="dummy-form-card fade-in" id="recordsCard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0; color: var(--text-dark); display: flex; align-items: center; gap: 0.5rem;">
                    <i class="bi bi-clock-history" style="color: var(--primary-blue);"></i>
                    Record List
                </h3>
                <button class="btn btn-primary btn-sm" onclick="showAddRecordModal()" style="padding: 0.5rem 1rem; min-width: auto;">
                    <i class="bi bi-plus-circle"></i>
                    <span>Add Record</span>
                </button>
            </div>
            <div id="statusMessage" class="dummy-status"></div>
            <div id="recordsList" style="max-height: 500px; overflow-y: auto;">
                <div style="text-align: center; padding: 2rem; color: var(--text-light);">
                    <i class="bi bi-hourglass-split" style="font-size: 2rem;"></i>
                    <p style="margin-top: 1rem;">Loading records...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Record Modal -->
    <div id="recordModal" class="modal-overlay" style="display: none;" onclick="if(event.target === this) closeRecordModal();">
        <div class="modal-content" onclick="event.stopPropagation();">
            <div class="modal-header">
                <h3>
                    <i class="bi bi-clipboard-plus"></i>
                    <span id="modalTitle">Add New Record</span>
                </h3>
                <button class="modal-close-btn" onclick="closeRecordModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="recordForm" onsubmit="saveRecord(event)">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-calendar"></i> Date
                        </label>
                        <input type="date" id="recordDate" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-clock"></i> Time
                        </label>
                        <input type="time" id="recordTime" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-activity"></i> Average Muscle Activity (%)
                        </label>
                        <input type="number" id="recordAvgMuscleActivity" class="form-input" min="0" max="100" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-arrow-repeat"></i> Movement Count
                        </label>
                        <input type="number" id="recordMovementCount" class="form-input" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-speedometer2"></i> Maximum Acceleration (g)
                        </label>
                        <input type="number" id="recordMaxAcceleration" class="form-input" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-hourglass-split"></i> Duration (seconds)
                        </label>
                        <input type="number" id="recordDuration" class="form-input" min="0" required>
                    </div>
                    <div class="modal-footer" style="padding: 0; border-top: none; margin-top: 0.5rem;">
                        <button type="button" class="btn btn-secondary" onclick="closeRecordModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>
        <a href="users.html" class="nav-item">
            <i class="bi bi-people"></i>
            <span>Members</span>
        </a>
        <a href="banners.html" class="nav-item">
            <i class="bi bi-images"></i>
            <span>Banner</span>
        </a>
        <a href="manage-data.html" class="nav-item active">
            <i class="bi bi-database-gear" style="color: #2563eb !important; display: inline-block !important; visibility: visible !important; opacity: 1 !important; font-size: 1.5rem !important; z-index: 1000 !important; position: relative !important; -webkit-text-fill-color: #2563eb !important; background: transparent !important; font-family: 'bootstrap-icons' !important;"></i>
            <span>Data</span>
        </a>
    </nav>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    
    <script src="../js/translations.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/admin/admin-shared.js"></script>
    <script src="../js/admin/manage-data.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
