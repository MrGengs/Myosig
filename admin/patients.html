<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Patient List</title>
    <link rel="icon" href="../assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <button onclick="window.location.href='users.html'" class="app-bar-back">
                <i class="bi bi-arrow-left"></i>
                <span>Back</span>
            </button>
            <span class="app-bar-page-title">Patient List</span>
            <div class="app-bar-actions">
                <div class="admin-avatar-wrap">
                    <div class="admin-avatar-btn" id="adminAvatarBtn" onclick="toggleAdminDropdown()" title="Admin Profile">A</div>
                    <div class="admin-avatar-dropdown" id="adminAvatarDropdown">
                        <div class="admin-avatar-dropdown-header">
                            <div class="admin-avatar-dropdown-name" id="adminDropdownName">Admin</div>
                            <div class="admin-avatar-dropdown-email" id="adminDropdownEmail">admin@myosig.com</div>
                        </div>
                        <button class="admin-avatar-dropdown-item danger" onclick="closeAdminDropdown(); adminLogout();">
                            <i class="bi bi-box-arrow-right"></i> Sign Out
                        </button>
                    </div>
                </div>
                <div class="admin-avatar-overlay" id="adminAvatarOverlay" onclick="closeAdminDropdown()"></div>
            </div>
        </div>
    </header>

    <button class="lang-toggle-btn" onclick="toggleLang()" style="background: transparent; border: 2px solid #2563eb; color: #2563eb; padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.75rem; border-radius: 8px; cursor: pointer; position: fixed; top: 10px; right: 10px; z-index: 9999; display: inline-flex; align-items: center; gap: 0.3rem;"><i class="bi bi-translate" style="font-size:1em"></i> ID</button>

    <div class="container" style="padding-bottom: 100px;">

        <!-- Doctor Info Header -->
        <div class="page-header fade-in">
            <div class="admin-user-avatar" id="doctorAvatar" style="width:70px; height:70px; font-size:2rem; margin:0 auto 0.75rem;">
                <i class="bi bi-person"></i>
            </div>
            <h1 id="doctorName">Doctor</h1>
            <p>Total: <strong id="totalPatientsCount">-</strong> patients</p>
        </div>

        <!-- Patient List -->
        <div id="patientsList" class="admin-list fade-in">
            <div class="admin-list-loading">
                <i class="bi bi-hourglass-split"></i>
                <p>Loading patient data...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <script src="../js/translations.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/admin/admin-shared.js"></script>
    <script src="../js/admin/admin-patients.js"></script>
    <script src="../js/navigation.js"></script>
</body>
</html>
