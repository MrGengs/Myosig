<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Perbandingan Sesi</title>
    <link rel="icon" href="assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        .compare-select-card {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            border: 1px solid rgba(255,255,255,0.6);
        }
        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .compare-grid { grid-template-columns: 1fr; }
        }
        .compare-stat {
            text-align: center;
            padding: 0.75rem;
            background: rgba(255,255,255,0.35);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            border: 1px solid rgba(255,255,255,0.35);
        }
        .compare-stat-label {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 0.25rem;
        }
        .compare-stat-value {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .compare-better { color: #0891b2; }
        .compare-worse { color: #B85A5A; }
        .compare-same { color: var(--text-dark); }
        .delta-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.25rem;
        }
        .delta-positive { background: rgba(8, 145, 178, 0.15); color: #0891b2; }
        .delta-negative { background: rgba(184, 90, 90, 0.15); color: #B85A5A; }
        .delta-neutral { background: rgba(122, 139, 168, 0.15); color: #7A8BA8; }
        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>

    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <button onclick="window.history.back()" class="app-bar-back">
                <i class="bi bi-arrow-left"></i>
                <span>Kembali</span>
            </button>
            <span class="app-bar-page-title">Perbandingan Sesi</span>
            <div class="app-bar-actions">
                <div class="app-bar-date" id="appBarDate"></div>
            </div>
        </div>
    </header>

    <div class="container" style="padding-bottom: 100px;">
        <!-- Page Header -->
        <div class="page-header fade-in">
            <h1><i class="bi bi-arrow-left-right card-icon"></i> Perbandingan Sesi</h1>
            <p>Bandingkan dua sesi monitoring secara side-by-side</p>
        </div>

        <!-- Patient & Session Selection -->
        <div class="card fade-in">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="bi bi-sliders card-icon"></i>
                    Pilih Sesi
                </h2>
            </div>

            <div style="padding: 0 0 0.5rem;">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-dark);">
                        <i class="bi bi-person-heart"></i> Pilih Pasien
                    </label>
                    <select id="patientSelect" class="form-control" style="width: 100%; padding: 0.75rem; border: 2px solid rgba(37, 99, 235, 0.2); border-radius: var(--border-radius); background: var(--white); color: var(--text-dark); font-size: 1rem;">
                        <option value="">-- Pilih Pasien --</option>
                    </select>
                </div>

                <div class="compare-grid">
                    <div class="compare-select-card">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: rgb(54, 162, 235); font-size: 0.9rem;">
                            <i class="bi bi-1-circle"></i> Sesi A
                        </label>
                        <select id="sessionA" class="form-control" style="width: 100%; padding: 0.6rem; border: 2px solid rgba(54, 162, 235, 0.3); border-radius: var(--border-radius); background: var(--white); font-size: 0.9rem;" disabled>
                            <option value="">-- Pilih Sesi --</option>
                        </select>
                    </div>
                    <div class="compare-select-card">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: rgb(255, 99, 132); font-size: 0.9rem;">
                            <i class="bi bi-2-circle"></i> Sesi B
                        </label>
                        <select id="sessionB" class="form-control" style="width: 100%; padding: 0.6rem; border: 2px solid rgba(255, 99, 132, 0.3); border-radius: var(--border-radius); background: var(--white); font-size: 0.9rem;" disabled>
                            <option value="">-- Pilih Sesi --</option>
                        </select>
                    </div>
                </div>

                <button id="btnCompare" class="btn btn-primary" onclick="compareSession()" style="margin-top: 1rem; margin-bottom: 0;" disabled>
                    <i class="bi bi-arrow-left-right"></i> Bandingkan
                </button>
            </div>
        </div>

        <!-- Comparison Results -->
        <div id="comparisonResults" style="display: none;">
            <!-- Stats Comparison -->
            <div class="card fade-in">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="bi bi-clipboard-data card-icon"></i>
                        Perbandingan Statistik
                    </h2>
                </div>
                <div id="statsComparison"></div>
            </div>

            <!-- EMG Chart Comparison -->
            <div class="card fade-in">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="bi bi-graph-up card-icon"></i>
                        Perbandingan EMG
                    </h2>
                </div>
                <div class="chart-container">
                    <canvas id="emgCompareChart"></canvas>
                </div>
            </div>

            <!-- Acceleration Chart Comparison -->
            <div class="card fade-in">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="bi bi-speedometer2 card-icon"></i>
                        Perbandingan Akselerasi
                    </h2>
                </div>
                <div class="chart-container">
                    <canvas id="accelCompareChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/session-compare.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app-header.js"></script>
</body>
</html>
