<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myosig - Halaman Tidak Ditemukan</title>
    <link rel="icon" href="assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .error-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--glass-shadow);
            padding: 3rem 2rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
            animation: fadeInUp 0.5s ease-out;
        }

        .error-icon {
            width: 100px;
            height: 100px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .error-code {
            font-size: 4rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
        }

        .error-desc {
            color: var(--text-gray);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .error-actions .btn {
            justify-content: center;
        }
    </style>
</head>
<body>
    <button class="lang-toggle-btn" onclick="toggleLang()" style="position: fixed; top: 10px; right: 10px; z-index: 9999; background: transparent; border: 2px solid #2563eb; color: #2563eb; padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.75rem; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem;"><i class="bi bi-translate" style="font-size:1em"></i> ID</button>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title" data-i18n="404.title">Page Not Found</h1>
            <p class="error-desc" data-i18n="404.desc">Sorry, the page you are looking for is not available or has been moved. Please return to the main page.</p>
            <div class="error-actions">
                <a href="dashboard.html" class="btn btn-primary">
                    <i class="bi bi-house-door"></i> <span data-i18n="404.dashboard">Back to Dashboard</span>
                </a>
                <a href="index.html" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> <span data-i18n="404.home">Home Page</span>
                </a>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
</body>
</html>
