<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Ensiklopedia Stroke</title>
    <link rel="icon" href="assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 1.25rem;
        }
        .search-container i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.1rem;
        }
        .search-input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: var(--border-radius);
            font-size: 1rem;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            color: var(--text-dark);
            box-shadow: inset 0 2px 8px rgba(30, 80, 140, 0.08);
            transition: var(--transition);
        }
        .search-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .search-input::placeholder { color: var(--text-light); }

        /* Category Pills */
        .category-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.25rem;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-pill {
            flex-shrink: 0;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.6);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            color: var(--text-dark);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            white-space: nowrap;
        }
        .category-pill:hover { transform: translateY(-1px); }
        .category-pill.active {
            background: var(--gradient-primary);
            color: var(--white);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
        }

        /* Article Cards */
        .article-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .article-card {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            border-radius: var(--border-radius);
            padding: 1.25rem;
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.6);
            position: relative;
            overflow: hidden;
        }
        .article-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
        }
        .article-card:active {
            transform: translateY(0);
            box-shadow: inset 0 2px 8px rgba(30, 80, 140, 0.08);
        }
        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            border-radius: 4px 0 0 4px;
        }
        .article-card[data-cat="dasar"]::before { background: #2563eb; }
        .article-card[data-cat="rehabilitasi"]::before { background: #0891b2; }
        .article-card[data-cat="nutrisi"]::before { background: #eab308; }
        .article-card[data-cat="olahraga"]::before { background: #f59e0b; }
        .article-card[data-cat="mental"]::before { background: #8B6AAA; }
        .article-card[data-cat="pencegahan"]::before { background: #14b8a6; }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .article-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: var(--white);
            flex-shrink: 0;
        }
        .article-card[data-cat="dasar"] .article-icon { background: var(--gradient-primary); }
        .article-card[data-cat="rehabilitasi"] .article-icon { background: var(--gradient-green); }
        .article-card[data-cat="nutrisi"] .article-icon { background: linear-gradient(135deg, #eab308, #facc15); }
        .article-card[data-cat="olahraga"] .article-icon { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
        .article-card[data-cat="mental"] .article-icon { background: linear-gradient(135deg, #8B6AAA, #9B7ABA); }
        .article-card[data-cat="pencegahan"] .article-icon { background: linear-gradient(135deg, #14b8a6, #2dd4bf); }

        .article-category-tag {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .article-card[data-cat="dasar"] .article-category-tag { background: rgba(37, 99, 235, 0.12); color: #2563eb; }
        .article-card[data-cat="rehabilitasi"] .article-category-tag { background: rgba(8, 145, 178, 0.12); color: #0891b2; }
        .article-card[data-cat="nutrisi"] .article-category-tag { background: rgba(234, 179, 8, 0.12); color: #b45309; }
        .article-card[data-cat="olahraga"] .article-category-tag { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
        .article-card[data-cat="mental"] .article-category-tag { background: rgba(139, 106, 170, 0.12); color: #8B6AAA; }
        .article-card[data-cat="pencegahan"] .article-category-tag { background: rgba(20, 184, 166, 0.12); color: #14b8a6; }

        .article-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
            line-height: 1.4;
        }
        .article-summary {
            font-size: 0.85rem;
            color: var(--text-gray);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .article-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.75rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(37, 99, 235, 0.06);
        }
        .article-read-time {
            font-size: 0.75rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .article-read-btn {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Article Detail View */
        .article-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--neumorphism-bg);
            z-index: 2000;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .article-detail-overlay::-webkit-scrollbar { display: none; }
        .article-detail-overlay.active { display: block; }
        .article-detail-header {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            padding: 1rem;
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.6);
        }
        .article-detail-back {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-dark);
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .article-detail-back:active { box-shadow: inset 0 2px 8px rgba(30, 80, 140, 0.08); }
        .article-detail-body {
            padding: 1.25rem;
            padding-bottom: 120px;
            max-width: 800px;
            margin: 0 auto;
        }
        .article-detail-body h1 {
            font-size: 1.5rem;
            line-height: 1.35;
            margin-bottom: 0.75rem;
        }
        .article-detail-body .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(37, 99, 235, 0.06);
        }
        .article-detail-body .detail-meta span {
            font-size: 0.8rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .article-content h2 {
            font-size: 1.2rem;
            color: var(--primary-blue);
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid rgba(37, 99, 235, 0.1);
        }
        .article-content h3 {
            font-size: 1.05rem;
            color: var(--text-dark);
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .article-content p {
            color: var(--text-dark);
            line-height: 1.85;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .article-content ul, .article-content ol {
            margin: 0.75rem 0 1rem 1.5rem;
            color: var(--text-dark);
        }
        .article-content li {
            line-height: 1.8;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
        }
        .article-content .info-box {
            padding: 1rem 1.25rem;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            margin: 1.25rem 0;
            border-left: 4px solid var(--primary-blue);
        }
        .article-content .info-box.warning {
            border-left-color: #f59e0b;
        }
        .article-content .info-box.success {
            border-left-color: #0891b2;
        }
        .article-content .info-box p {
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }
        .article-content .info-box strong {
            color: var(--primary-blue);
        }

        /* Empty State */
        .empty-search {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }
        .empty-search i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        /* Article count badge */
        .article-count {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        @media (min-width: 600px) {
            .article-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <a href="dashboard.html" class="app-bar-brand">
                <img src="assets/image/logo.png" alt="Myosig" class="app-bar-logo">
            </a>
            <div class="app-bar-actions">
                <div class="app-bar-date" id="appBarDate"></div>
                <button class="lang-toggle-btn" onclick="toggleLang()" style="background: transparent; border: 2px solid #2563eb; color: #2563eb; padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.75rem; border-radius: 8px; cursor: pointer; margin-right: 0.5rem;">ID</button>
                <a href="account.html" class="app-bar-avatar" id="appBarAvatar" title="Profil"><i class="bi bi-person"></i></a>
            </div>
        </div>
    </header>

    <div class="container" style="padding-bottom: 100px;">
        <!-- Page Header -->
        <div class="page-header fade-in" style="position: relative; padding-top: 2rem;">
            <div style="width: 70px; height: 70px; background: var(--gradient-primary); border-radius: 20px; margin: 0 auto 0.75rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--white); box-shadow: var(--shadow-lg);">
                <i class="bi bi-book"></i>
            </div>
            <h1 style="font-size: 1.6rem;" data-i18n="enc.title">Stroke Encyclopedia</h1>
            <p data-i18n="enc.subtitle">Complete guide about stroke, rehabilitation, and recovery</p>
        </div>

        <!-- Search -->
        <div class="search-container fade-in">
            <i class="bi bi-search"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search articles..." data-i18n-placeholder="enc.search" oninput="filterArticles()">
        </div>

        <!-- Category Filter -->
        <div class="category-scroll fade-in" id="categoryScroll">
            <button class="category-pill active" onclick="setCategory('semua')" data-cat="semua">
                <i class="bi bi-grid-3x3-gap"></i> <span data-i18n="enc.cat.all">All</span>
            </button>
            <button class="category-pill" onclick="setCategory('dasar')" data-cat="dasar">
                <i class="bi bi-heart-pulse"></i> <span data-i18n="enc.cat.basics">Stroke Basics</span>
            </button>
            <button class="category-pill" onclick="setCategory('rehabilitasi')" data-cat="rehabilitasi">
                <i class="bi bi-bandaid"></i> <span data-i18n="enc.cat.rehab">Rehabilitation</span>
            </button>
            <button class="category-pill" onclick="setCategory('nutrisi')" data-cat="nutrisi">
                <i class="bi bi-cup-hot"></i> <span data-i18n="enc.cat.nutrition">Nutrition</span>
            </button>
            <button class="category-pill" onclick="setCategory('olahraga')" data-cat="olahraga">
                <i class="bi bi-bicycle"></i> <span data-i18n="enc.cat.exercise">Exercise</span>
            </button>
            <button class="category-pill" onclick="setCategory('mental')" data-cat="mental">
                <i class="bi bi-emoji-smile"></i> <span data-i18n="enc.cat.mental">Mental Health</span>
            </button>
            <button class="category-pill" onclick="setCategory('pencegahan')" data-cat="pencegahan">
                <i class="bi bi-shield-check"></i> <span data-i18n="enc.cat.prevention">Prevention</span>
            </button>
        </div>

        <!-- Article Count -->
        <div class="article-count fade-in" id="articleCount"></div>

        <!-- Article List -->
        <div class="article-grid" id="articleGrid">
            <!-- Articles will be rendered by JS -->
        </div>
    </div>

    <!-- Article Detail Overlay -->
    <div class="article-detail-overlay" id="articleDetail">
        <div class="article-detail-header">
            <button class="article-detail-back" onclick="closeArticle()">
                <i class="bi bi-arrow-left"></i>
            </button>
            <span style="font-weight: 600; color: var(--text-dark); font-size: 0.95rem;" id="detailHeaderTitle" data-i18n="enc.article">Article</span>
        </div>
        <div class="article-detail-body" id="articleDetailBody">
            <!-- Article content rendered here -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="bi bi-house-door"></i>
            <span data-i18n="nav.home">Home</span>
        </a>
        <a href="sensors.html" class="nav-item">
            <i class="bi bi-activity"></i>
            <span data-i18n="nav.monitoring">Monitoring</span>
        </a>
        <a href="encyclopedia.html" class="nav-item active">
            <i class="bi bi-book" style="color: #2563eb !important; display: inline-block !important; visibility: visible !important; opacity: 1 !important; font-size: 1.5rem !important; z-index: 1000 !important; position: relative !important; -webkit-text-fill-color: #2563eb !important; background: transparent !important; font-family: 'bootstrap-icons' !important;"></i>
            <span data-i18n="nav.encyclopedia">Encyclopedia</span>
        </a>
        <a href="patient.html" class="nav-item">
            <i class="bi bi-person-heart"></i>
            <span data-i18n="nav.patients">Patients</span>
        </a>
        <a href="account.html" class="nav-item">
            <i class="bi bi-person"></i>
            <span data-i18n="nav.account">Account</span>
        </a>
    </nav>

    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/encyclopedia.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app-header.js"></script>
</body>
</html>
