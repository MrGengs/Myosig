<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myosig - Redirecting...</title>
    <meta http-equiv="refresh" content="2;url=https://myosiq.web.app">
    <link rel="icon" href="assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f4ff 50%, #e0ecff 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1e293b;
        }

        .redirect-card {
            text-align: center;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 90%;
        }

        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        .logo-wrapper img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(37, 99, 235, 0.15);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        .countdown-text {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .countdown-text span {
            font-weight: 700;
            color: #2563eb;
        }

        .manual-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .manual-link:hover { text-decoration: underline; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="logo-wrapper">
            <img src="assets/image/logo.png" alt="Myosig">
        </div>
        <h1>Myosig</h1>
        <p class="subtitle">Smart Wearable Device for<br>Stroke Rehabilitation Patient</p>
        <div class="spinner"></div>
        <p class="countdown-text">Redirecting in <span id="countdown">2</span> seconds...</p>
        <a href="https://myosiq.web.app" class="manual-link">
            <i class="bi bi-box-arrow-up-right"></i> Go to myosiq.web.app
        </a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

    <!-- Config (contains API key - listed in .gitignore) -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
