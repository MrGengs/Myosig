<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Myosig - Daftar Pasien</title>
    <link rel="icon" href="assets/image/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .patient-list-item {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .patient-list-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
        }

        .patient-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .patient-info {
            flex: 1;
            min-width: 0;
        }

        .patient-name {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .patient-details {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .patient-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .btn-icon {
            padding: 0.5rem;
            min-width: auto;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .search-box {
            margin-bottom: 1.5rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px);
            color: var(--text-dark);
            box-shadow: 0 8px 32px rgba(30,80,140,0.08);
        }

        .search-box input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <!-- ===== APP BAR ===== -->
    <header class="app-bar">
        <div class="app-bar-inner">
            <a href="dashboard.html" class="app-bar-brand">
                <img src="assets/image/logo.png" alt="Myosig" class="app-bar-logo">
            </a>
            <div class="app-bar-actions">
                <div class="app-bar-date" id="appBarDate"></div>
                <button class="lang-toggle-btn" onclick="toggleLang()" style="background: transparent; border: 2px solid #2563eb; color: #2563eb; padding: 0.3rem 0.6rem; font-weight: 700; font-size: 0.75rem; border-radius: 8px; cursor: pointer; margin-right: 0.5rem; display: inline-flex; align-items: center; gap: 0.3rem;"><i class="bi bi-translate" style="font-size:1em"></i> ID</button>
                <a href="account.html" class="app-bar-avatar" id="appBarAvatar" title="Profil"><i class="bi bi-person"></i></a>
            </div>
        </div>
    </header>

    <div class="container" style="padding-bottom: 100px;">
        <!-- Page Header -->
        <div class="page-header fade-in" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1><i class="bi bi-person-heart" style="color: var(--primary-blue);"></i> <span data-i18n="patient.title">Patient List</span></h1>
                <p data-i18n="patient.subtitle">Manage your patient data</p>
            </div>
            <button onclick="showAddPatientModal()" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
                <i class="bi bi-plus-circle"></i> <span data-i18n="patient.add">Add Patient</span>
            </button>
        </div>

        <!-- Search Box -->
        <div class="search-box fade-in">
            <i class="bi bi-search"></i>
            <input type="text" id="searchInput" placeholder="Search patients by name or email..." data-i18n-placeholder="patient.search" oninput="filterPatients()">
        </div>

        <!-- Patient List -->
        <div id="patientList" class="fade-in">
            <div class="card" style="text-align: center; padding: 2rem;">
                <i class="bi bi-hourglass-split" style="font-size: 2rem; color: var(--text-light);"></i>
                <p style="margin-top: 1rem; color: var(--text-light);" data-i18n="patient.loading">Loading patient list...</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Patient Modal -->
    <div id="patientModal" class="modal-overlay" style="display: none;" onclick="if(event.target === this) closePatientModal();">
        <div class="modal-content" onclick="event.stopPropagation();">
            <div class="modal-header">
                <h3>
                    <i class="bi bi-person-plus"></i>
                    <span id="patientModalTitle" data-i18n="patient.modal.add_title">Add Patient</span>
                </h3>
                <button class="modal-close-btn" onclick="closePatientModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-person"></i> <span data-i18n="patient.form.name">Full Name</span>
                    </label>
                    <input type="text" id="patientName" class="form-input" placeholder="Enter full name" data-i18n-placeholder="patient.form.name.placeholder">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-envelope"></i> Email
                    </label>
                    <input type="email" id="patientEmail" class="form-input" placeholder="Enter email" data-i18n-placeholder="patient.form.email.placeholder">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-telephone"></i> <span data-i18n="patient.form.phone">Phone Number</span>
                    </label>
                    <input type="tel" id="patientPhone" class="form-input" placeholder="Enter phone number" data-i18n-placeholder="patient.form.phone.placeholder">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-calendar"></i> <span data-i18n="patient.form.birthdate">Date of Birth</span>
                    </label>
                    <input type="date" id="patientBirthDate" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-gender-ambiguous"></i> <span data-i18n="patient.form.gender">Gender</span>
                    </label>
                    <select id="patientGender" class="form-input">
                        <option value="" data-i18n="patient.form.gender.select">-- Select --</option>
                        <option value="Laki-laki" data-i18n="patient.form.gender.male">Male</option>
                        <option value="Perempuan" data-i18n="patient.form.gender.female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-geo-alt"></i> <span data-i18n="patient.form.address">Address</span>
                    </label>
                    <textarea id="patientAddress" class="form-input" rows="3" placeholder="Enter address" data-i18n-placeholder="patient.form.address.placeholder"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-calendar-event"></i> <span data-i18n="patient.form.stroke_date">Stroke Date</span>
                    </label>
                    <input type="date" id="patientStrokeDate" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-file-text"></i> <span data-i18n="patient.form.medical_notes">Medical Notes</span>
                    </label>
                    <textarea id="patientMedicalNotes" class="form-input" rows="3" placeholder="Enter medical notes" data-i18n-placeholder="patient.form.medical_notes.placeholder"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="closePatientModal()" class="btn btn-secondary" data-i18n="btn.cancel">Cancel</button>
                <button onclick="savePatient()" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> <span data-i18n="btn.save">Save</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="bi bi-house-door"></i>
            <span data-i18n="nav.home">Home</span>
        </a>
        <a href="sensors.html" class="nav-item">
            <i class="bi bi-activity"></i>
            <span data-i18n="nav.monitoring">Monitoring</span>
        </a>
        <a href="encyclopedia.html" class="nav-item">
            <i class="bi bi-book"></i>
            <span data-i18n="nav.encyclopedia">Encyclopedia</span>
        </a>
        <a href="patient.html" class="nav-item active">
            <i class="bi bi-person-heart" style="color: #2563eb !important; display: inline-block !important; visibility: visible !important; opacity: 1 !important; font-size: 1.5rem !important; z-index: 1000 !important; position: relative !important; -webkit-text-fill-color: #2563eb !important; background: transparent !important; font-family: 'bootstrap-icons' !important;"></i>
            <span data-i18n="nav.patients">Patients</span>
        </a>
        <a href="account.html" class="nav-item">
            <i class="bi bi-person"></i>
            <span data-i18n="nav.account">Account</span>
        </a>
    </nav>

    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/patient.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app-header.js"></script>
</body>
</html>
